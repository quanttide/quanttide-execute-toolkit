name: ci-rust

on:
  push:
    branches: [main]
    paths: ['packages/rust/**', 'tests/**']
  pull_request:
    paths: ['packages/rust/**', 'tests/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - run: cargo test
