name: ci-go

on:
  push:
    branches: [main]
    paths: ['packages/go/**', 'tests/**']
  pull_request:
    paths: ['packages/go/**', 'tests/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./... -count=1
