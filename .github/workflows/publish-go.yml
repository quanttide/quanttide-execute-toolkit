name: publish-go

on:
  push:
    tags:
      - 'go/*'
  workflow_dispatch:
    inputs:
      tag:
        description: Go release tag to process, for example go/v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-module-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            go/v*) ;;
            *) echo "expected a go/vX.Y.Z tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac

          VERSION="${RELEASE_TAG#go/}"
          grep -Fq "## [$VERSION]" packages/go/CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: create Go module alias tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ALIAS_TAG="packages/go/$VERSION"
          TARGET_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          EXISTING_SHA="$(git ls-remote --quiet --refs origin "refs/tags/$ALIAS_TAG" | awk '{print $1}')"

          if [ -n "$EXISTING_SHA" ]; then
            test "$EXISTING_SHA" = "$TARGET_SHA"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "$ALIAS_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$ALIAS_TAG"
